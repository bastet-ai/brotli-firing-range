static_resources:
  listeners:
  - name: br-in
    address: { socket_address: { address: 0.0.0.0, port_value: 10000 } }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress
          route_config:
            name: r
            virtual_hosts:
            - name: vh
              domains: ["*"]
              routes:
              - match: { prefix: "/" }
                route: { cluster: origin }
          http_filters:
          # THE vuln surface: decompress REQUEST bodies with embedded brotli
          # (schema grounded on v1.39.2 api/envoy/extensions/filters/http/
          #  decompressor/v3/decompressor.proto - request_direction_config)
          - name: envoy.filters.http.decompressor
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.decompressor.v3.Decompressor
              decompressor_library:
                name: br
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.compression.brotli.decompressor.v3.Brotli
              request_direction_config:
                common_config:
                  enabled:
                    default_value: true
                    runtime_key: decompressor.br.request.enabled
                  ignore_no_transform_header: false
                advertise_accept_encoding:
                  value: true
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
  - name: origin
    type: STRICT_DNS
    load_assignment:
      cluster_name: origin
      endpoints:
      - lb_endpoints:
        - endpoint: { address: { socket_address: { address: node-vuln, port_value: 8121 } } }
admin:
  address: { socket_address: { address: 0.0.0.0, port_value: 9901 } }
